name: Topic digest image

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # manual Run button

permissions:
  contents: write          # lets the workflow commit the image

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: Build image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPICS: "machine-learning,llm,rust"   # <- change to your topics
          DAYS: "7"
          PER_TOPIC: "8"
        run: python make_image.py

      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest.png
          git diff --cached --quiet || git commit -m "Update topic digest image"
          git push

      - name: Show link
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output/latest.png"
          echo "### Your image" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Image link: $URL"
